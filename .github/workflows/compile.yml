name: LaTeX build

permissions:
  contents: write

on:
  push:
    branches:
      - '*'
    tags:
      - '*'
  release:
    types:
      - created
      - published
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Install prerequisites
        run: sudo apt-get update && sudo apt-get install -y texlive-latex-extra texlive-xetex latexmk
      
      - name: Compile the documents
        run: make all

      - name: Prepare release assets
        run: |
          cp output/booklet/booklet.pdf output/sangbog.pdf
          cp output/kontinuert/kontinuert.pdf output/sangbog-kontinuert.pdf
      
      - name: Upload songbook (booklet)
        uses: actions/upload-artifact@v4
        with:
          name: Sangbog
          path: output/sangbog.pdf
      
      - name: Upload songbook (continuous)
        uses: actions/upload-artifact@v4
        with:
          name: Kontinuert
          path: output/sangbog-kontinuert.pdf
      
      - name: Upload release assets (tag push)
        if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          draft: true
          tag_name: ${{ github.ref_name }}
          files: |
            output/sangbog.pdf
            output/sangbog-kontinuert.pdf

      - name: Upload release assets (release event)
        if: github.event_name == 'release'
        uses: softprops/action-gh-release@v2
        with:
          files: |
            output/sangbog.pdf
            output/sangbog-kontinuert.pdf